<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grants Manager</title>
  <link rel="stylesheet" href="/app/styles.css">
  <link rel="icon" type="image/png" href="/app/icon.png" id="favicon">
  <link rel="apple-touch-icon" href="/app/icon.png">
  <link rel="manifest" href="/app/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Grants">
  <meta name="theme-color" content="#2f6fed">
</head>
<body>
  <div class="topbar">
    <div class="logo"><img src="/app/icon.png" alt="" style="width:28px;height:28px;border-radius:8px"> Grants Manager</div>
    <nav id="nav">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="summary">Summary</button>
      <button data-view="people">People</button>
      <button data-view="allexpenses">All Expenses</button>
      <button data-view="instructions">Instructions</button>
    </nav>
    <div class="spacer"></div>
    <div class="searchbox">
      <span class="mag">🔍</span>
      <input id="global-search" placeholder="Search…" autocomplete="off">
      <div id="search-results" class="search-results" style="display:none"></div>
    </div>
    <button class="icon-btn bell" id="btn-bell" title="Notifications" style="font-size:16px">🔔<span id="bell-dot" class="bell-dot" hidden></span></button>
    <button class="btn secondary small" id="btn-workday" title="Workday sync and import">⇅ Workday</button>
    <button class="icon-btn" id="btn-dark" title="Toggle dark mode" style="font-size:17px">🌙</button>
    <button class="btn secondary small" id="btn-gen-salaries" title="Create monthly salary + fringe charges for appointments with auto-charge enabled">↻ Update Salaries</button>
    <button class="btn small" id="btn-new-grant">+ New grant</button>
    <button class="icon-btn" id="btn-settings" title="Settings — defaults, Workday connection, grant worktags" style="font-size:16px">⚙️</button>
  </div>
  <main id="main"></main>
  <div id="modal-root"></div>
  <div id="toast"></div>
  <footer class="app-credits no-print">Grants Manager · built by <strong>Sam Fernandes</strong> · <a href="mailto:samuelbf@uark.edu">samuelbf@uark.edu</a></footer>
  <script src="/app/chart.umd.js"></script>
  <script src="/app/app.js"></script>
</body>
</html>
